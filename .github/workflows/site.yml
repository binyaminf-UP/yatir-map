name: עדכון מהמפה ופרסום האתר

on:
  schedule:
    - cron: "*/15 * * * *"   # בדיקת שינויים במפה ובגיליון כל 15 דקות
    - cron: "17 3 * * 0"     # פעם בשבוע: מונע מ-GitHub לכבות את התזמון אחרי 60 יום ללא פעילות
  workflow_dispatch:          # הפעלה ידנית: Actions ← Run workflow
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: site
  cancel-in-progress: false

env:
  # השכבות היחידות שיוצאות מהמפה לאתר. כמה שכבות – מפרידים ב-|
  LAYERS: "טבלת היפוך שם ומס איתור"

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: התקנת ספריית הצפנה
        run: python -m pip install --quiet cryptography

      - name: הורדה, סינון והצפנה
        id: build
        env:
          MAP_ID: ${{ secrets.MAP_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_GID: ${{ secrets.SHEET_GID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SCAN_API: ${{ secrets.SCAN_API }}
          SCAN_TOKEN: ${{ secrets.SCAN_TOKEN }}
        run: python scripts/build_data.py

      - name: האם לפרסם
        id: decide
        run: |
          if [ "${{ steps.build.outputs.changed }}" = "true" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: הכנת האתר לפרסום
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: פרסום
        id: deployment
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5

      # טביעת האצבע נשמרת רק אחרי פרסום מוצלח. אם הפרסום נכשל, הריצה הבאה תזהה שינוי ותנסה שוב.
      - name: שמירת טביעת האצבע
        if: steps.build.outputs.changed == 'true' && steps.deployment.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state
          git commit -m "עדכון נתונים"
          git pull --rebase --quiet
          git push

      - name: שמירת התזמון בחיים
        if: github.event.schedule == '17 3 * * 0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/site.yml/enable"
