<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f5f4a">
<title>איתור – בית יתיר</title>
<style>
  :root {
    --bg: #f4f6f4;
    --surface: #ffffff;
    --text: #1b2420;
    --muted: #5f6b66;
    --border: #dde3df;
    --accent: #1f5f4a;
    --accent-soft: #e3efe9;
    --waze: #33ccff;
    --waze-text: #06202b;
    --gmaps: #1a73e8;
    --call: #1e8e3e;
    --danger: #b3261e;
    --rec: #d93025;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111614;
      --surface: #1a211e;
      --text: #e7ece9;
      --muted: #9aa7a1;
      --border: #2b3531;
      --accent: #6cc2a0;
      --accent-soft: #1f2e28;
      --gmaps: #5b9cf5;
      --call: #34a853;
      --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif;
    font-size: 19px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 1.45rem; margin: 0; }
  .call {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    border-radius: 999px;
    background: var(--call);
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .call svg { width: 20px; height: 20px; fill: currentColor; }
  .search { position: relative; }
  #q {
    width: 100%;
    font: inherit;
    font-size: 1.4rem;
    padding: 16px 16px 16px 100px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  #q::-webkit-search-cancel-button { display: none; }
  .tools {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 4px;
  }
  .tool {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tool svg { width: 26px; height: 26px; fill: currentColor; }
  #clear { display: none; }
  #clear.show { display: inline-flex; }
  #mic { background: var(--accent-soft); color: var(--accent); }
  #mic.on { background: var(--rec); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(217, 48, 37, .25); } }
  #status { font-size: .85rem; color: var(--muted); margin-top: 6px; min-height: 1.3em; }
  #status.err { color: var(--danger); }
  main { padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
  .hint { color: var(--muted); text-align: center; padding: 36px 8px; font-size: 1.1rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-head { display: flex; align-items: flex-start; gap: 14px; }
  .loc {
    flex: none;
    min-width: 84px;
    padding: 8px 10px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    text-align: center;
    line-height: 1.15;
  }
  .loc small { display: block; font-size: .8rem; opacity: .85; }
  .loc b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .name { font-size: 1.35rem; font-weight: 700; margin: 0; word-break: break-word; line-height: 1.3; }
  .meta { font-size: 1rem; color: var(--muted); margin-top: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    flex: 1 1 0;
    min-width: 120px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px 12px;
    border-radius: 14px;
    border: 0;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-waze { background: var(--waze); color: var(--waze-text); }
  .btn-gmaps { background: var(--gmaps); color: #fff; }
  .btn-share { flex: 0 0 auto; min-width: 0; background: var(--accent-soft); color: var(--accent); }
  .nocoords { margin-top: 12px; font-size: 1rem; color: var(--muted); }
  .more { text-align: center; color: var(--muted); font-size: 1rem; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 3px; }
  .phones { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .tel {
    flex: 1 1 0;
    min-width: 96px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 10px 8px;
    border-radius: 14px;
    border: 2px solid var(--call);
    color: var(--call);
    background: var(--surface);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.2;
  }
  .tel span { display: inline-flex; align-items: center; gap: 6px; }
  .tel svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  .tel small { font-weight: 400; font-size: .85rem; color: var(--muted); direction: ltr; }
  /* מסך סיסמה */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  #gate[hidden] { display: none; }
  .gate-box { width: 100%; max-width: 420px; text-align: center; }
  .gate-box h2 { font-size: 1.5rem; margin: 0 0 6px; }
  .gate-box p { color: var(--muted); margin: 0 0 18px; }
  #pw {
    width: 100%;
    font: inherit;
    font-size: 1.4rem;
    text-align: center;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
  }
  #pw:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  #pwGo {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border: 0;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--bg);
    font: inherit;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
  }
  #pwGo:disabled { opacity: .6; }
  #pwMsg { min-height: 1.5em; margin-top: 10px; color: var(--danger); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>איתור בבית יתיר</h1>
      <a class="call" href="tel:+972522490428" aria-label="התקשרות לראם, 052-2490428">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        טלפון לראם
      </a>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="איתור, שם או טלפון" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="חיפוש" autofocus>
      <div class="tools">
        <button id="clear" class="tool" type="button" aria-label="ניקוי">×</button>
        <button id="mic" class="tool" type="button" aria-label="חיפוש בקול" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
        </button>
      </div>
    </div>
    <div id="status">טוען…</div>
  </div>
</header>
<main class="wrap" id="results"><p class="hint">טוען נתונים…</p></main>

<section id="gate" hidden>
  <form class="gate-box" id="gateForm" autocomplete="off">
    <h2>איתור בבית יתיר</h2>
    <p>הכניסה לתושבים בלבד. הזינו את הסיסמה הקהילתית.</p>
    <input id="pw" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="סיסמה" aria-label="סיסמה">
    <button id="pwGo" type="submit">כניסה</button>
    <div id="pwMsg" role="alert"></div>
  </form>
</section>

<script>
const DATA_URL = 'data/data.enc.json';
const MAX_RESULTS = 30;
const CACHE_KEY = 'yatir-enc-v1';          // הקובץ המוצפן (בטוח לשמור)
const PASS_KEY = 'yatir-pass-v1';          // הסיסמה + מועד הזנה
const PASS_TTL = 60 * 24 * 3600 * 1000;    // חודשיים
const ICON_PHONE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
const ICON_HOME = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>';

let places = [];
let lastUpdated = '';
const $q = document.getElementById('q');
const $results = document.getElementById('results');
const $status = document.getElementById('status');
const $clear = document.getElementById('clear');
const $mic = document.getElementById('mic');

const FINALS = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
function norm(s) {
  return String(s || '')
    .replace(/[֑-ׇ‎‏]/g, '')
    .replace(/[ךםןףץ]/g, c => FINALS[c])
    .replace(/["'`״׳\-–_.,/\\()+?!]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtTime(t) {
  return new Date(t).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function setStatus(msg, isErr) {
  $status.textContent = msg;
  $status.classList.toggle('err', !!isErr);
}
function defaultStatus() {
  if (places.length && lastUpdated) setStatus(`${places.length} רשומות · עודכן ${fmtTime(lastUpdated)}`);
}

function prepare(data) {
  return (data.items || []).map((it, i) => ({
    id: i,
    name: it.n || '(ללא שם)',
    loc: it.l == null ? '' : String(it.l),
    cluster: it.c == null ? '' : String(it.c),
    point: (typeof it.lat === 'number' && typeof it.lon === 'number') ? { lat: it.lat, lon: it.lon } : null,
    pm: it.pm || '', pw: it.pw || '', ph: it.ph || '',
    nm: it.nm || '', nw: it.nw || '',
    phones: [it.pm, it.pw, it.ph].filter(Boolean).join(' '),
    nName: norm(it.n),
    hay: norm([it.n, it.l, it.c ? 'אשכול ' + it.c : ''].join(' ')),
  }));
}

function search(q) {
  const nq = norm(q);
  if (!nq) return [];
  const tokens = nq.split(' ');
  const isNum = /^\d+$/.test(nq);
  const out = [];
  for (const p of places) {
    let score = 0;
    if (isNum) {
      if (p.loc === nq) score = 100;
      else if (p.loc.startsWith(nq)) score = 70;
      else if (p.cluster === nq) score = 30;
      else if (new RegExp('(^| )' + nq + '( |$)').test(p.nName)) score = 25;
      else if (nq.length >= 5 && p.phones.includes(nq.replace(/^972/, '0'))) score = 50;
      else if (p.loc.includes(nq)) score = 15;
    } else if (tokens.every(t => p.hay.includes(t))) {
      score = 40;
      if (p.nName.startsWith(nq)) score = 80;
      else if (new RegExp('(^| )' + nq.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(p.nName)) score = 65;
    }
    if (score) out.push({ p, score });
  }
  out.sort((a, b) => b.score - a.score
    || (parseInt(a.p.loc) || 1e9) - (parseInt(b.p.loc) || 1e9)
    || a.p.name.localeCompare(b.p.name, 'he', { numeric: true }));
  return out.map(o => o.p);
}

// הדגשה: מחפשים בטקסט המקורי (לא אחרי esc), עם התאמה בין אותיות סופיות לרגילות ודילוג על ניקוד
const EQUIV = { 'כ': '[כך]', 'מ': '[מם]', 'נ': '[נן]', 'פ': '[פף]', 'צ': '[צץ]' };
function tokenPattern(t) {
  return Array.from(t)
    .map(ch => EQUIV[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
    .join('[\\u0591-\\u05C7\\u200e\\u200f]*');
}
function highlight(text, q) {
  text = String(text);
  const tokens = norm(q).split(' ')
    .filter(t => t.length > 1 || /\d/.test(t))
    .sort((a, b) => b.length - a.length);
  if (!tokens.length) return esc(text);
  const re = new RegExp(tokens.map(tokenPattern).join('|'), 'gi');
  let out = '', last = 0;
  for (const m of text.matchAll(re)) {
    out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function card(p, q) {
  let actions = '<p class="nocoords">אין מיקום למקום זה</p>';
  if (p.point) {
    const ll = p.point.lat + ',' + p.point.lon;
    actions = `<div class="actions">
      <a class="btn btn-waze" href="https://waze.com/ul?ll=${ll}&navigate=yes" target="_blank" rel="noopener">ניווט ב-Waze</a>
      <a class="btn btn-gmaps" href="https://www.google.com/maps/dir/?api=1&destination=${ll}" target="_blank" rel="noopener">Google Maps</a>
      <button class="btn btn-share" type="button" data-share="${p.id}" aria-label="שיתוף מיקום">שיתוף</button>
    </div>`;
  }
  const tels = [];
  if (p.pm) tels.push(telBtn(p.pm, ICON_PHONE, p.nm || 'איש'));
  if (p.pw) tels.push(telBtn(p.pw, ICON_PHONE, p.nw || 'אישה'));
  if (p.ph) tels.push(telBtn(p.ph, ICON_HOME, 'בית'));
  return `<article class="card">
    <div class="card-head">
      ${p.loc ? `<div class="loc"><small>איתור</small><b>${highlight(p.loc, q)}</b></div>` : ''}
      <div>
        <h2 class="name">${highlight(p.name, q)}</h2>
        ${p.cluster ? `<div class="meta">אשכול ${esc(p.cluster)}</div>` : ''}
      </div>
    </div>
    ${actions}
    ${tels.length ? `<div class="phones">${tels.join('')}</div>` : ''}
  </article>`;
}

function fmtPhone(d) {
  if (/^05\d{8}$/.test(d) || /^07\d{8}$/.test(d)) return d.slice(0, 3) + '-' + d.slice(3);
  if (/^0[2-489]\d{7}$/.test(d)) return d.slice(0, 2) + '-' + d.slice(2);
  return d;
}
function telBtn(num, icon, label) {
  const intl = '+972' + num.replace(/^0/, '');
  return `<a class="tel" href="tel:${intl}" aria-label="התקשרות ל${esc(label)}, ${fmtPhone(num)}">
    <span>${icon}${esc(label)}</span><small>${fmtPhone(num)}</small></a>`;
}

function render() {
  const q = $q.value;
  $clear.classList.toggle('show', !!q);
  if (!places.length) return;
  if (!norm(q)) {
    $results.innerHTML = '<p class="hint">הקלידו מספר איתור, שם משפחה או מספר טלפון'
      + ($mic.hidden ? '' : '<br>או לחצו על המיקרופון ואמרו "איתור 8854"') + '</p>';
    return;
  }
  const res = search(q);
  if (!res.length) {
    $results.innerHTML = `<p class="hint">לא נמצאו תוצאות ל"${esc(q)}"</p>`;
    return;
  }
  const shown = res.slice(0, MAX_RESULTS);
  $results.innerHTML = shown.map(p => card(p, q)).join('')
    + (res.length > shown.length ? `<p class="more">מוצגות ${shown.length} מתוך ${res.length} – צמצמו את החיפוש</p>` : '');
}

/* ---------- שיתוף ---------- */
$results.addEventListener('click', async e => {
  const b = e.target.closest('[data-share]');
  if (!b) return;
  const p = places[+b.dataset.share];
  if (!p || !p.point) return;
  const url = `https://www.google.com/maps/search/?api=1&query=${p.point.lat},${p.point.lon}`;
  const title = (p.loc ? 'איתור ' + p.loc + ' – ' : '') + p.name;
  try {
    if (navigator.share) await navigator.share({ title, text: title + ', בית יתיר', url });
    else {
      await navigator.clipboard.writeText(title + '\n' + url);
      b.textContent = 'הועתק';
      setTimeout(() => { b.textContent = 'שיתוף'; }, 1500);
    }
  } catch (_) { /* בוטל */ }
});

/* ---------- חיפוש חי ---------- */
let tId;
function onQueryChange(immediate) {
  clearTimeout(tId);
  const run = () => {
    render();
    try {
      const u = new URL(location.href);
      $q.value ? u.searchParams.set('q', $q.value) : u.searchParams.delete('q');
      history.replaceState(null, '', u);
    } catch (_) {}
  };
  immediate ? run() : (tId = setTimeout(run, 120));
}
$q.addEventListener('input', () => onQueryChange(false));
$clear.addEventListener('click', () => { $q.value = ''; onQueryChange(true); $q.focus(); });
$q.addEventListener('keydown', e => { if (e.key === 'Enter') $q.blur(); });

/* ---------- פוקוס אוטומטי ----------
   הדפדפנים בטלפון לא פותחים מקלדת בלי נגיעה של המשתמש.
   לכן: הסמן מוכן בשדה, ונגיעה בכל מקום ריק בכותרת או במסך הפתיחה פותחת את המקלדת. */
function focusSearch() {
  const g = document.getElementById('gate');
  const el = (g && !g.hidden) ? document.getElementById('pw') : $q;
  try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); }
}
window.addEventListener('pageshow', focusSearch);
document.addEventListener('click', e => {
  if (e.target.closest('a, button, input, .card, #gate')) return;
  focusSearch();
});

/* ---------- חיפוש קולי ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const STOP_WORDS = new Set(['איתור', 'מספר', 'משפחת', 'משפחה', 'של', 'את', 'חפש', 'תחפש', 'בית']);
function parseSpoken(text) {
  const t = String(text).replace(/[‎‏]/g, '');
  const joined = t.replace(/(\d)[\s,.\-]+(?=\d)/g, '$1');
  const num = joined.match(/\d+/);
  if (num) return num[0];
  return t.split(/\s+/).filter(w => w && !STOP_WORDS.has(norm(w))).join(' ');
}
let rec = null;
if (SR) {
  $mic.hidden = false;
  $mic.addEventListener('click', () => {
    if (rec) { rec.stop(); return; }
    try {
      rec = new SR();
      rec.lang = 'he-IL';
      rec.interimResults = true;
      rec.maxAlternatives = 1;
      rec.continuous = false;
      rec.onresult = e => {
        const text = Array.from(e.results).map(r => r[0].transcript).join(' ');
        $q.value = parseSpoken(text);
        onQueryChange(true);
      };
      rec.onerror = e => {
        const msg = {
          'not-allowed': 'אין הרשאה למיקרופון – אפשרו בהגדרות הדפדפן',
          'service-not-allowed': 'זיהוי קולי לא זמין בדפדפן הזה',
          'no-speech': 'לא נקלט דיבור – נסו שוב',
          'network': 'זיהוי קולי דורש חיבור לאינטרנט',
        }[e.error] || 'זיהוי הקול נכשל – נסו שוב';
        setStatus(msg, true);
      };
      rec.onend = () => {
        rec = null;
        $mic.classList.remove('on');
        $mic.setAttribute('aria-label', 'חיפוש בקול');
        if (!$status.classList.contains('err')) defaultStatus();
      };
      rec.start();
      $mic.classList.add('on');
      $mic.setAttribute('aria-label', 'עצירת הקלטה');
      setStatus('מקשיב… אמרו למשל "איתור 8854" או שם משפחה');
    } catch (_) {
      rec = null;
      setStatus('לא ניתן להפעיל זיהוי קולי בדפדפן הזה', true);
    }
  });
}

/* ---------- טעינה, סיסמה ופענוח ---------- */
const $gate = document.getElementById('gate');
const $gateForm = document.getElementById('gateForm');
const $pw = document.getElementById('pw');
const $pwGo = document.getElementById('pwGo');
const $pwMsg = document.getElementById('pwMsg');
let enc = null;

function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (_) { return null; }
}
function saveCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
}
// סיסמה סלחנית: בלי רווחים, ואותיות סופיות כרגילות ("עין טובה" = "עינטובה")
function normPass(s) {
  return String(s || '').replace(/\s+/g, '').replace(/[ךםןףץ]/g, c => FINALS[c]);
}
function getSavedPass() {
  try {
    const o = JSON.parse(localStorage.getItem(PASS_KEY) || 'null');
    if (o && o.p && Date.now() - o.t < PASS_TTL) return o.p;
  } catch (_) {}
  return null;
}
function savePass(p) {
  try { localStorage.setItem(PASS_KEY, JSON.stringify({ p, t: Date.now() })); } catch (_) {}
}
function clearPass() {
  try { localStorage.removeItem(PASS_KEY); } catch (_) {}
}
function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function decrypt(e, pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, key, b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function askPassword(msg) {
  return new Promise(resolve => {
    $gate.hidden = false;
    $pwMsg.textContent = msg || '';
    setTimeout(() => $pw.focus(), 50);
    $gateForm.onsubmit = async ev => {
      ev.preventDefault();
      const p = normPass($pw.value);
      if (!p) return;
      $pwGo.disabled = true;
      $pwGo.textContent = 'בודק…';
      try {
        const data = await decrypt(enc, p);
        savePass(p);
        $gate.hidden = true;
        $pw.value = '';
        resolve(data);
      } catch (_) {
        $pwMsg.textContent = 'סיסמה שגויה – נסו שוב';
        $pw.select();
      } finally {
        $pwGo.disabled = false;
        $pwGo.textContent = 'כניסה';
      }
    };
  });
}
async function unlock() {
  const saved = getSavedPass();
  if (saved) {
    try { return await decrypt(enc, saved); }
    catch (_) { clearPass(); return askPassword('הסיסמה הוחלפה – הזינו את הסיסמה החדשה'); }
  }
  return askPassword();
}

async function init() {
  try {
    const q0 = new URL(location.href).searchParams.get('q');
    if (q0) $q.value = q0;
  } catch (_) {}

  if (!window.crypto || !crypto.subtle) {
    setStatus('הדפדפן לא תומך', true);
    $results.innerHTML = '<p class="hint">הדפדפן הזה ישן מדי. פתחו את הקישור בכרום או בספארי מעודכנים.</p>';
    return;
  }

  const cached = loadCache();
  let fresh = null, netErr = null;
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('שגיאת רשת ' + r.status);
    fresh = await r.json();
    saveCache(fresh);
  } catch (err) { netErr = err; }

  enc = fresh || cached;
  if (!enc || !enc.ct) {
    setStatus('שגיאה', true);
    $results.innerHTML = `<p class="hint">לא ניתן לטעון את הנתונים<br>${esc(netErr ? netErr.message : '')}</p>`;
    return;
  }

  const data = await unlock();
  places = prepare(data);
  lastUpdated = enc.updated;
  if (fresh) defaultStatus();
  else setStatus(`אין חיבור – נתונים שמורים מ-${fmtTime(enc.updated)}`, true);
  render();
  focusSearch();
}
init();
</script>
