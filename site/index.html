<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f5f4a">
<title>איתור – בית יתיר</title>
<style>
  :root {
    --bg: #f4f6f4;
    --surface: #ffffff;
    --text: #1b2420;
    --muted: #5f6b66;
    --border: #dde3df;
    --accent: #1f5f4a;
    --accent-soft: #e3efe9;
    --waze: #33ccff;
    --waze-text: #06202b;
    --gmaps: #1a73e8;
    --call: #1e8e3e;
    --danger: #b3261e;
    --rec: #d93025;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111614;
      --surface: #1a211e;
      --text: #e7ece9;
      --muted: #9aa7a1;
      --border: #2b3531;
      --accent: #6cc2a0;
      --accent-soft: #1f2e28;
      --gmaps: #5b9cf5;
      --call: #34a853;
      --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif;
    font-size: 19px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 1.45rem; margin: 0; }
  .call {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    border-radius: 999px;
    background: var(--call);
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .call svg { width: 20px; height: 20px; fill: currentColor; }
  .search { position: relative; }
  #q {
    width: 100%;
    font: inherit;
    font-size: 1.4rem;
    padding: 16px 16px 16px 100px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  #q::-webkit-search-cancel-button { display: none; }
  .tools {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 4px;
  }
  .tool {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tool svg { width: 26px; height: 26px; fill: currentColor; }
  #clear { display: none; }
  #clear.show { display: inline-flex; }
  #mic { background: var(--accent-soft); color: var(--accent); }
  #mic.on { background: var(--rec); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(217, 48, 37, .25); } }
  #status { font-size: .85rem; color: var(--muted); margin-top: 6px; min-height: 1.3em; }
  #status.err { color: var(--danger); }
  main { padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
  .hint { color: var(--muted); text-align: center; padding: 36px 8px; font-size: 1.1rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-head { display: flex; align-items: flex-start; gap: 14px; }
  .loc {
    flex: none;
    min-width: 84px;
    padding: 8px 10px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    text-align: center;
    line-height: 1.15;
  }
  .loc small { display: block; font-size: .8rem; opacity: .85; }
  .loc b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .name { font-size: 1.35rem; font-weight: 700; margin: 0; word-break: break-word; line-height: 1.3; }
  .meta { font-size: 1rem; color: var(--muted); margin-top: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    flex: 1 1 0;
    min-width: 120px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px 12px;
    border-radius: 14px;
    border: 0;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-waze { background: var(--waze); color: var(--waze-text); }
  .btn-gmaps { background: var(--gmaps); color: #fff; }
  .btn-share { flex: 0 0 auto; min-width: 0; background: var(--accent-soft); color: var(--accent); }
  .nocoords { margin-top: 12px; font-size: 1rem; color: var(--muted); }
  .more { text-align: center; color: var(--muted); font-size: 1rem; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 3px; }
  .phones { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .tel {
    flex: 1 1 0;
    min-width: 96px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 10px 8px;
    border-radius: 14px;
    border: 2px solid var(--call);
    color: var(--call);
    background: var(--surface);
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.2;
  }
  .tel span { display: inline-flex; align-items: center; gap: 6px; }
  .tel svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  .tel small { font-weight: 400; font-size: .85rem; color: var(--muted); direction: ltr; }
  /* מסך סיסמה */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  #gate[hidden] { display: none; }
  .gate-box { width: 100%; max-width: 420px; text-align: center; }
  .gate-box h2 { font-size: 1.5rem; margin: 0 0 6px; }
  .gate-box p { color: var(--muted); margin: 0 0 18px; }
  #pw {
    width: 100%;
    font: inherit;
    font-size: 1.4rem;
    text-align: center;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
  }
  #pw:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  #pwGo {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border: 0;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--bg);
    font: inherit;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
  }
  #pwGo:disabled { opacity: .6; }
  #pwMsg { min-height: 1.5em; margin-top: 10px; color: var(--danger); }
  /* ---------- סריקת אשכולות ---------- */
  .scan {
    background: var(--surface);
    border: 2px solid var(--danger);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .scan label { display: block; font-weight: 800; font-size: 1.25rem; margin-bottom: 10px; color: var(--danger); }
  .scan-row { display: flex; gap: 10px; }
  #cnum {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1.4rem;
    text-align: center;
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  #cnum:focus { border-color: var(--danger); }
  #cgo {
    flex: none;
    padding: 12px 22px;
    border: 0;
    border-radius: 12px;
    background: var(--danger);
    color: #fff;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { #cgo { color: #1a0f0f; } }
  #cmsg { min-height: 1.3em; margin-top: 6px; color: var(--danger); font-size: .95rem; }
  .cmap-title { color: var(--muted); margin: 4px 2px 6px; }
  .cmap {
    display: block;
    width: 100%;
    height: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    touch-action: manipulation;
  }
  .cmap .cl { cursor: pointer; }
  .cmap .cl polygon { transition: fill-opacity .15s; }
  .cmap .cl:hover polygon, .cmap .cl:focus polygon { fill-opacity: .6; }
  .cmap .cl:focus { outline: none; }
  .cmap text {
    pointer-events: none;
    text-anchor: middle;
    font-weight: 800;
    fill: var(--text);
    paint-order: stroke;
    stroke: var(--surface);
    stroke-width: 3px;
  }
  .cmap .num { font-size: 14px; }
  .cmap .cnt { font-size: 10px; font-weight: 700; }
  .cmap .cnt.full { fill: var(--call); }
  .cmap .dot { fill: var(--muted); opacity: .55; pointer-events: none; }
  .home-hint { color: var(--muted); text-align: center; font-size: 1rem; margin: 4px 0 10px; }

  #cv {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: var(--bg);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  #cv[hidden] { display: none; }
  body.cv-open { overflow: hidden; }
  .cv-head {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: var(--surface);
    border-bottom: 5px solid var(--accent);
  }
  .cv-back {
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 1.5rem;
    cursor: pointer;
  }
  .cv-head h2 { margin: 0; font-size: 1.4rem; }
  .cv-prog { margin-inline-start: auto; font-weight: 800; color: var(--call); font-size: 1.1rem; white-space: nowrap; }
  .cv-bar { height: 8px; background: var(--border); }
  .cv-bar i { display: block; height: 100%; width: 0; background: var(--call); transition: width .25s; }
  .cv-sync { text-align: center; font-size: .9rem; color: var(--muted); padding: 6px 16px; min-height: 1.4em; }
  .cv-sync.err { color: var(--danger); }
  #cvList { padding: 0 16px; }
  .srow {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
  }
  .srow.done { background: color-mix(in srgb, var(--call) 12%, var(--surface)); border-color: color-mix(in srgb, var(--call) 45%, var(--border)); }
  .chk { flex: none; cursor: pointer; padding: 2px; }
  .chk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chk span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 3px solid var(--muted);
    border-radius: 10px;
    background: var(--surface);
    color: #fff;
    font-size: 1.5rem;
    font-weight: 900;
  }
  .chk input:checked + span { background: var(--call); border-color: var(--call); }
  .chk input:checked + span::after { content: "✓"; }
  .chk input:focus-visible + span { box-shadow: 0 0 0 4px var(--accent-soft); }
  .who { flex: 1; min-width: 0; }
  .who-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .who-top b { font-size: 1.2rem; line-height: 1.3; word-break: break-word; }
  .who-top small { color: var(--muted); font-size: .95rem; }
  .who-top em { font-style: normal; color: var(--call); font-size: .85rem; font-weight: 700; }
  .mtels { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .mtel {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 2px solid var(--call);
    color: var(--call);
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
  }
  .mtel svg { width: 18px; height: 18px; fill: currentColor; }
  .note {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 1.05rem;
    line-height: 1.4;
    resize: vertical;
    min-height: 46px;
    outline: none;
  }
  .note:focus { border-color: var(--accent); }
  .cv-sep { color: var(--muted); font-weight: 700; margin: 18px 4px 8px; }
  .cv-foot { display: flex; gap: 10px; padding: 8px 16px 0; }
  .cv-foot button {
    flex: 1;
    padding: 15px 10px;
    border-radius: var(--radius);
    font: inherit;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
  }
  .cv-wa { background: #25d366; color: #06301a; border: 0; }
  .cv-clear { background: var(--surface); color: var(--danger); border: 2px solid var(--danger); }
  .cv-clear.armed { background: var(--danger); color: #fff; }
  .cv-note { color: var(--muted); font-size: .85rem; text-align: center; padding: 10px 16px 0; }
  /* ===== פריסה קומפקטית לטלפון ===== */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; font-size: 17px; }
  header { position: static; flex: none; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; }
  .top { margin-bottom: 8px; }
  h1 { font-size: 1.15rem; }
  .call { padding: 7px 12px; font-size: .95rem; }
  .call svg { width: 17px; height: 17px; }
  #q { font-size: 1.2rem; padding: 11px 12px 11px 88px; }
  .tool { width: 38px; height: 38px; }
  .tool svg { width: 22px; height: 22px; }
  #status { font-size: .78rem; margin-top: 4px; min-height: 0; }
  body.searching #status:not(.err) { display: none; }
  main#results {
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
  }
  body.home main#results { display: flex; flex-direction: column; overflow: hidden; }
  .hint { padding: 20px 8px; font-size: 1rem; }

  /* בית: שורת אשכול + מפה שממלאת את המסך */
  .scan { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin: 0; flex: none; border-width: 2px; }
  .scan label { margin: 0; font-size: 1.05rem; white-space: nowrap; }
  #cnum { flex: 1; font-size: 1.15rem; padding: 8px; }
  #cgo { padding: 9px 14px; font-size: 1.05rem; }
  #cmsg { flex: none; min-height: 0; margin: 4px 2px 0; font-size: .9rem; }
  #cmsg:empty { display: none; }
  .cmap-wrap { position: relative; flex: 1; min-height: 160px; margin-top: 8px; }
  .cmap { width: 100%; height: 100%; margin: 0; }
  .cmap-cap { position: absolute; top: 6px; right: 10px; font-size: .8rem; color: var(--muted); pointer-events: none; }

  /* כרטיס תוצאה */
  .card { padding: 10px 12px; margin-bottom: 10px; }
  .card-head { align-items: center; gap: 10px; }
  .loc { min-width: 58px; padding: 4px 6px; }
  .loc small { font-size: .68rem; }
  .loc b { font-size: 1.2rem; }
  .ttl { flex: 1; min-width: 0; }
  .name { font-size: 1.12rem; }
  .meta { font-size: .82rem; margin-top: 0; }
  .share-ic {
    flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .share-ic svg { width: 18px; height: 18px; fill: currentColor; }
  .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .acts .tel {
    flex: 1 1 0; min-width: 76px; flex-direction: row; gap: 5px;
    padding: 8px 6px; font-size: .98rem; border-width: 2px; border-radius: 12px;
  }
  .acts .tel span { display: inline; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts .tel svg { width: 18px; height: 18px; }
  .ic {
    flex: none; width: 50px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding: 5px 0; border-radius: 12px; text-decoration: none; font-weight: 700;
  }
  .ic svg { width: 22px; height: 22px; fill: currentColor; }
  .ic small { font-size: .66rem; line-height: 1; }
  .ic-waze { background: var(--waze); color: var(--waze-text); }
  .ic-gm { background: var(--gmaps); color: #fff; }
  .ic-home { border: 2px solid var(--call); color: var(--call); background: var(--surface); }
  .nocoords { margin: 8px 0 0; font-size: .9rem; }

  /* מסך אשכול: סימון | שם + הערה | טלפונים בצד שמאל */
  .cv-head { padding: calc(6px + env(safe-area-inset-top)) 12px 6px; gap: 8px; border-bottom-width: 4px; }
  .cv-back { width: 38px; height: 38px; font-size: 1.3rem; }
  .cv-head h2 { font-size: 1.15rem; }
  .cv-prog { font-size: 1rem; }
  .cv-bar { height: 6px; }
  .cv-sync { font-size: .8rem; padding: 4px 12px; }
  #cvList { padding: 0 10px; }
  .srow {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "chk top t1" "chk note t2";
    align-items: center;
    gap: 6px 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .srow .chk { grid-area: chk; align-self: center; padding: 0; }
  .chk span { width: 36px; height: 36px; font-size: 1.3rem; border-width: 3px; }
  .srow .who-top { grid-area: top; gap: 2px 8px; }
  .srow .who-top b { font-size: 1.05rem; }
  .srow .who-top small { font-size: .85rem; }
  .srow .who-top em { font-size: .8rem; }
  .srow .note { grid-area: note; margin: 0; min-height: 38px; padding: 7px 9px; font-size: .98rem; resize: none; overflow: hidden; }
  .srow .mtel { width: 92px; justify-content: flex-start; padding: 6px 8px; font-size: .9rem; gap: 4px; border-radius: 10px; }
  .srow .mtel span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .mtel svg { width: 16px; height: 16px; flex: none; }
  .srow .t1 { grid-area: t1; }
  .srow .t2 { grid-area: t2; }
  .cv-sep { margin: 12px 4px 6px; font-size: .9rem; }
  .cv-foot { padding: 6px 10px 0; }
  .cv-foot button { padding: 12px 8px; font-size: .98rem; }
  .cv-note { font-size: .78rem; padding: 8px 12px 0; }
  /* כותרת אשכול בצבע האשכול, קפואה בראש המסך */
  .cv-top { position: sticky; top: 0; z-index: 3; background: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .cv-head { position: static; border-bottom: 0; color: #fff; padding-top: calc(10px + env(safe-area-inset-top)); padding-bottom: 10px; }
  .cv-head h2 { font-size: 1.35rem; font-weight: 800; }
  .cv-head .cv-prog { color: inherit; }
  .cv-head .cv-back { background: rgba(255,255,255,.25); color: inherit; }
  .cv-head.light { color: #1b2420; }
  .cv-head.light .cv-back { background: rgba(0,0,0,.12); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>איתור בבית יתיר</h1>
      <a class="call" href="tel:+972522490428" aria-label="התקשרות לראם, 052-2490428">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        טלפון לראם
      </a>
    </div>
    <div class="search">
      <input id="q" type="search" value="" placeholder="איתור, שם או טלפון" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="חיפוש" autofocus>
      <div class="tools">
        <button id="clear" class="tool" type="button" aria-label="ניקוי">×</button>
        <button id="mic" class="tool" type="button" aria-label="חיפוש בקול" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
        </button>
      </div>
    </div>
    <div id="status">טוען…</div>
  </div>
</header>
<main class="wrap" id="results"><p class="hint">טוען נתונים…</p></main>

<section id="cv" hidden aria-live="polite">
  <div class="cv-top">
  <div class="cv-head" id="cvHead">
    <button class="cv-back" id="cvBack" type="button" aria-label="חזרה">→</button>
    <h2 id="cvTitle">אשכול</h2>
    <span class="cv-prog" id="cvProg"></span>
  </div>
  <div class="cv-bar"><i id="cvBar"></i></div>
  <div class="cv-sync" id="cvSync"></div>
  </div>
  <div class="wrap" id="cvList"></div>
  <div class="wrap cv-foot">
    <button type="button" class="cv-wa" id="cvWa">שליחת סיכום בוואטסאפ</button>
    <button type="button" class="cv-clear" id="cvClear">ניקוי האשכול</button>
  </div>
  <p class="wrap cv-note">הסימונים משותפים לכל מי שנכנס לאתר, ונמחקים אוטומטית 24 שעות אחרי השינוי האחרון.</p>
</section>

<section id="gate" hidden>
  <form class="gate-box" id="gateForm" autocomplete="off">
    <h2>איתור בבית יתיר</h2>
    <p>הכניסה לתושבים בלבד. הזינו את הסיסמה הקהילתית.</p>
    <input id="pw" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="סיסמה" aria-label="סיסמה">
    <button id="pwGo" type="submit">כניסה</button>
    <div id="pwMsg" role="alert"></div>
  </form>
</section>

<script>
const DATA_URL = 'data/data.enc.json';
const MAX_RESULTS = 30;
const CACHE_KEY = 'yatir-enc-v1';          // הקובץ המוצפן (בטוח לשמור)
const PASS_KEY = 'yatir-pass-v1';          // הסיסמה + מועד הזנה
const PASS_TTL = 60 * 24 * 3600 * 1000;    // חודשיים
const ICON_PHONE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
const ICON_HOME = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>';

let places = [];
let lastUpdated = '';
const $q = document.getElementById('q');
const $results = document.getElementById('results');
const $status = document.getElementById('status');
const $clear = document.getElementById('clear');
const $mic = document.getElementById('mic');

const FINALS = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
function norm(s) {
  return String(s || '')
    .replace(/[֑-ׇ‎‏]/g, '')
    .replace(/[ךםןףץ]/g, c => FINALS[c])
    .replace(/["'`״׳\-–_.,/\\()+?!]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}
// שלד: בלי אהו"י, ק=כ, ט=ת (אחרי norm). 'שלו' = 'שליו' = 'שולו', 'יעקבי' = 'יעקובי'
function skelWord(w) {
  const t = w.replace(/ק/g, 'כ').replace(/ט/g, 'ת');
  const s = t.replace(/[אהוי]/g, '');
  return s.length >= 2 ? s : t;
}
function skel(s) { return norm(s).split(' ').map(skelWord).join(' '); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtTime(t) {
  return new Date(t).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function setStatus(msg, isErr) {
  $status.textContent = msg;
  $status.classList.toggle('err', !!isErr);
}
function defaultStatus() {
  if (places.length && lastUpdated) setStatus(`${places.length} רשומות · עודכן ${fmtTime(lastUpdated)}`);
}

function prepare(data) {
  return (data.items || []).map((it, i) => ({
    id: i,
    name: it.n || '(ללא שם)',
    loc: it.l == null ? '' : String(it.l),
    cluster: it.c == null ? '' : String(it.c),
    point: (typeof it.lat === 'number' && typeof it.lon === 'number') ? { lat: it.lat, lon: it.lon } : null,
    pm: it.pm || '', pw: it.pw || '', ph: it.ph || '',
    nm: it.nm || '', nw: it.nw || '',
    phones: [it.pm, it.pw, it.ph].filter(Boolean).join(' '),
    nName: norm(it.n),
    sName: skel(it.n),
    hay: norm([it.n, it.l, it.c ? 'אשכול ' + it.c : ''].join(' ')),
    sHay: skel(it.n),
  }));
}

function search(q) {
  const nq = norm(q);
  if (!nq) return [];
  const tokens = nq.split(' ');
  const isNum = /^\d+$/.test(nq);
  const sq = nq.split(' ').map(skelWord).join(' ');
  const sTokens = nq.replace(/\d/g, '').trim().length >= 2 ? sq.split(' ').filter(Boolean) : [];
  const out = [];
  for (const p of places) {
    let score = 0;
    if (isNum) {
      if (p.loc === nq) score = 100;
      else if (p.loc.startsWith(nq)) score = 70;
      else if (p.cluster === nq) score = 30;
      else if (new RegExp('(^| )' + nq + '( |$)').test(p.nName)) score = 25;
      else if (nq.length >= 5 && p.phones.includes(nq.replace(/^972/, '0'))) score = 50;
      else if (p.loc.includes(nq)) score = 15;
    } else if (tokens.every(t => p.hay.includes(t))) {
      score = 40;
      if (p.nName.startsWith(nq)) score = 80;
      else if (new RegExp('(^| )' + nq.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(p.nName)) score = 65;
    } else if (sTokens.length && sTokens.every(t => p.sHay.includes(t))) {
      // התאמה בלי אהו"י – בעדיפות נמוכה מהתאמה מדויקת
      score = p.sName.startsWith(sq) ? 60 : 35;
    }
    if (score) out.push({ p, score });
  }
  out.sort((a, b) => b.score - a.score
    || (parseInt(a.p.loc) || 1e9) - (parseInt(b.p.loc) || 1e9)
    || a.p.name.localeCompare(b.p.name, 'he', { numeric: true }));
  return out.map(o => o.p);
}

// הדגשה: מחפשים בטקסט המקורי (לא אחרי esc), עם התאמה בין אותיות סופיות לרגילות ודילוג על ניקוד
const EQUIV = { 'כ': '[כך]', 'מ': '[מם]', 'נ': '[נן]', 'פ': '[פף]', 'צ': '[צץ]' };
function tokenPattern(t) {
  return Array.from(t)
    .map(ch => EQUIV[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
    .join('[\\u0591-\\u05C7\\u200e\\u200f]*');
}
const LOOSE = { 'כ': '[כךק]', 'ת': '[תט]', 'מ': '[מם]', 'נ': '[נן]', 'פ': '[פף]', 'צ': '[צץ]' };
function loosePattern(t) {
  const sk = skelWord(t);
  if (sk.length < 2 || /\d/.test(sk)) return null;
  return '[אהוי]*' + Array.from(sk)
    .map(ch => LOOSE[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
    .join('[אהוי\\u0591-\\u05C7\\u200e\\u200f]*') + '[אהוי]*';
}
function highlight(text, q) {
  text = String(text);
  const tokens = norm(q).split(' ')
    .filter(t => t.length > 1 || /\d/.test(t))
    .sort((a, b) => b.length - a.length);
  if (!tokens.length) return esc(text);
  const pats = tokens.map(tokenPattern).concat(tokens.map(loosePattern).filter(Boolean));
  const re = new RegExp(pats.join('|'), 'gi');
  let out = '', last = 0;
  for (const m of text.matchAll(re)) {
    out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

const ICON_NAV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>';
const ICON_PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const ICON_SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg>';

function card(p, q) {
  const btns = [];
  if (p.pm) btns.push(telBtn(p.pm, ICON_PHONE, p.nm || 'איש'));
  if (p.pw) btns.push(telBtn(p.pw, ICON_PHONE, p.nw || 'אישה'));
  if (p.ph) btns.push(`<a class="ic ic-home" href="tel:+972${p.ph.replace(/^0/, '')}" aria-label="התקשרות לבית, ${fmtPhone(p.ph)}">${ICON_HOME}<small>בית</small></a>`);
  if (p.point) {
    const ll = p.point.lat + ',' + p.point.lon;
    btns.push(`<a class="ic ic-waze" href="https://waze.com/ul?ll=${ll}&navigate=yes" target="_blank" rel="noopener" aria-label="ניווט ב-Waze">${ICON_NAV}<small>Waze</small></a>`);
    btns.push(`<a class="ic ic-gm" href="https://www.google.com/maps/dir/?api=1&destination=${ll}" target="_blank" rel="noopener" aria-label="ניווט ב-Google Maps">${ICON_PIN}<small>מפות</small></a>`);
  }
  return `<article class="card">
    <div class="card-head">
      ${p.loc ? `<div class="loc"><small>איתור</small><b>${highlight(p.loc, q)}</b></div>` : ''}
      <div class="ttl">
        <h2 class="name">${highlight(p.name, q)}</h2>
        ${p.cluster ? `<div class="meta">אשכול ${esc(p.cluster)}</div>` : ''}
      </div>
      ${p.point ? `<button class="share-ic" type="button" data-share="${p.id}" aria-label="שיתוף מיקום">${ICON_SHARE}</button>` : ''}
    </div>
    ${btns.length ? `<div class="acts">${btns.join('')}</div>` : '<p class="nocoords">אין מיקום ואין טלפון</p>'}
  </article>`;
}

function fmtPhone(d) {
  if (/^05\d{8}$/.test(d) || /^07\d{8}$/.test(d)) return d.slice(0, 3) + '-' + d.slice(3);
  if (/^0[2-489]\d{7}$/.test(d)) return d.slice(0, 2) + '-' + d.slice(2);
  return d;
}
function telBtn(num, icon, label) {
  const intl = '+972' + num.replace(/^0/, '');
  return `<a class="tel" href="tel:${intl}" aria-label="התקשרות ל${esc(label)}, ${fmtPhone(num)}">${icon}<span>${esc(label)}</span></a>`;
}

function render() {
  const q = $q.value;
  $clear.classList.toggle('show', !!q);
  if (!places.length) return;
  const searching = !!norm(q);
  document.body.classList.toggle('searching', searching);
  document.body.classList.toggle('home', !searching);
  $results.scrollTop = 0;
  if (!searching) {
    renderHome();
    return;
  }
  const res = search(q);
  if (!res.length) {
    $results.innerHTML = `<p class="hint">לא נמצאו תוצאות ל"${esc(q)}"</p>`;
    return;
  }
  const shown = res.slice(0, MAX_RESULTS);
  $results.innerHTML = shown.map(p => card(p, q)).join('')
    + (res.length > shown.length ? `<p class="more">מוצגות ${shown.length} מתוך ${res.length} – צמצמו את החיפוש</p>` : '');
}

/* ---------- שיתוף ---------- */
$results.addEventListener('click', async e => {
  const b = e.target.closest('[data-share]');
  if (!b) return;
  const p = places[+b.dataset.share];
  if (!p || !p.point) return;
  const url = `https://www.google.com/maps/search/?api=1&query=${p.point.lat},${p.point.lon}`;
  const title = (p.loc ? 'איתור ' + p.loc + ' – ' : '') + p.name;
  try {
    if (navigator.share) await navigator.share({ title, text: title + ', בית יתיר', url });
    else {
      await navigator.clipboard.writeText(title + '\n' + url);
      b.textContent = 'הועתק';
      setTimeout(() => { b.textContent = 'שיתוף'; }, 1500);
    }
  } catch (_) { /* בוטל */ }
});

/* ---------- חיפוש חי ---------- */
let tId;
function onQueryChange(immediate) {
  clearTimeout(tId);
  const run = () => render();
  immediate ? run() : (tId = setTimeout(run, 120));
}
$q.addEventListener('input', () => onQueryChange(false));
$clear.addEventListener('click', () => { $q.value = ''; onQueryChange(true); $q.focus(); });
$q.addEventListener('keydown', e => { if (e.key === 'Enter') $q.blur(); });

/* ---------- פוקוס אוטומטי ----------
   הדפדפנים בטלפון לא פותחים מקלדת בלי נגיעה של המשתמש.
   לכן: הסמן מוכן בשדה, ונגיעה בכל מקום ריק בכותרת או במסך הפתיחה פותחת את המקלדת. */
function focusSearch() {
  const g = document.getElementById('gate');
  if (!document.getElementById('cv').hidden) return;
  const el = (g && !g.hidden) ? document.getElementById('pw') : $q;
  try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); }
}
window.addEventListener('pageshow', e => {
  if (e.persisted && $q.value) { $q.value = ''; onQueryChange(true); }
  focusSearch();
});
document.addEventListener('click', e => {
  if (e.target.closest('a, button, input, textarea, .card, #gate, #cv, .scan, .cmap')) return;
  focusSearch();
});

/* ---------- חיפוש קולי ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const STOP_WORDS = new Set(['איתור', 'מספר', 'משפחת', 'משפחה', 'של', 'את', 'חפש', 'תחפש', 'בית']);
function parseSpoken(text) {
  const t = String(text).replace(/[‎‏]/g, '');
  const joined = t.replace(/(\d)[\s,.\-]+(?=\d)/g, '$1');
  const num = joined.match(/\d+/);
  if (num) return num[0];
  return t.split(/\s+/).filter(w => w && !STOP_WORDS.has(norm(w))).join(' ');
}
let rec = null;
if (SR) {
  $mic.hidden = false;
  $mic.addEventListener('click', () => {
    if (rec) { rec.stop(); return; }
    try {
      rec = new SR();
      rec.lang = 'he-IL';
      rec.interimResults = true;
      rec.maxAlternatives = 1;
      rec.continuous = false;
      rec.onresult = e => {
        const text = Array.from(e.results).map(r => r[0].transcript).join(' ');
        $q.value = parseSpoken(text);
        onQueryChange(true);
      };
      rec.onerror = e => {
        const msg = {
          'not-allowed': 'אין הרשאה למיקרופון – אפשרו בהגדרות הדפדפן',
          'service-not-allowed': 'זיהוי קולי לא זמין בדפדפן הזה',
          'no-speech': 'לא נקלט דיבור – נסו שוב',
          'network': 'זיהוי קולי דורש חיבור לאינטרנט',
        }[e.error] || 'זיהוי הקול נכשל – נסו שוב';
        setStatus(msg, true);
      };
      rec.onend = () => {
        rec = null;
        $mic.classList.remove('on');
        $mic.setAttribute('aria-label', 'חיפוש בקול');
        if (!$status.classList.contains('err')) defaultStatus();
      };
      rec.start();
      $mic.classList.add('on');
      $mic.setAttribute('aria-label', 'עצירת הקלטה');
      setStatus('מקשיב… אמרו למשל "איתור 8854" או שם משפחה');
    } catch (_) {
      rec = null;
      setStatus('לא ניתן להפעיל זיהוי קולי בדפדפן הזה', true);
    }
  });
}

/* ---------- סריקת אשכולות צח"י ---------- */
const SCAN_STATE_KEY = 'yatir-scan-state-v1';   // מצב אחרון שהתקבל מהשרת (לתצוגה בלי קליטה)
const SCAN_QUEUE_KEY = 'yatir-scan-queue-v1';   // שינויים שעוד לא נשמרו בשרת
const SCAN_TTL = 24 * 3600 * 1000;
const POLL_MS = 12000;
const SUMMARY_MS = 30000;

let clusters = [];
let scanApi = '';
let scanToken = '';
let scanState = {};
let scanQueue = [];
let scanSummary = {};
let curCluster = null;
let pollTimer = null, summaryTimer = null, flushTimer = null;
let flushing = false;
let lastSync = 0;
let openedByPush = false;

const $cv = document.getElementById('cv');
const $cvHead = document.getElementById('cvHead');
const $cvTitle = document.getElementById('cvTitle');
const $cvProg = document.getElementById('cvProg');
const $cvBar = document.getElementById('cvBar');
const $cvSync = document.getElementById('cvSync');
const $cvList = document.getElementById('cvList');
const $cvClear = document.getElementById('cvClear');

function lsGet(k, d) {
  try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (_) { return d; }
}
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }

function pruneState(st) {
  const now = Date.now();
  for (const c of Object.keys(st || {})) {
    for (const k of Object.keys(st[c] || {})) {
      if (!st[c][k] || now - (st[c][k].t || 0) > SCAN_TTL) delete st[c][k];
    }
    if (!Object.keys(st[c] || {}).length) delete st[c];
  }
  return st || {};
}

async function sha256hex(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
}

async function setupScan(data) {
  clusters = (data.clusters || []).map(c => Object.assign({}, c, { id: String(c.id) }));
  scanApi = data.api || '';
  scanState = pruneState(lsGet(SCAN_STATE_KEY, {}));
  scanQueue = lsGet(SCAN_QUEUE_KEY, []).filter(op => Date.now() - (op.t || 0) < SCAN_TTL);
  const pass = getSavedPass();
  if (pass) scanToken = await sha256hex(pass + '|yatir-scan');
  if (scanQueue.length) scheduleFlush(500);
  refreshSummary();
  clearInterval(summaryTimer);
  summaryTimer = setInterval(() => {
    if (document.visibilityState === 'visible' && !curCluster && !norm($q.value)) refreshSummary();
  }, SUMMARY_MS);
}

function recKey(p) { return ((p.loc || '') + '|' + p.name).slice(0, 78); }

function clusterItems(cid) {
  return places
    .filter(p => p.cluster === cid)
    .sort((a, b) => ((a.loc ? 0 : 1) - (b.loc ? 0 : 1))
      || (parseInt(a.loc) || 0) - (parseInt(b.loc) || 0)
      || a.name.localeCompare(b.name, 'he'));
}

/* מצב אפקטיבי = מה שהשרת החזיר + שינויים מקומיים שעוד בדרך */
function stateFor(cid) {
  const st = JSON.parse(JSON.stringify(scanState[cid] || {}));
  for (const op of scanQueue) {
    if (op.c !== cid) continue;
    const cur = st[op.k] || {};
    if ('s' in op) cur.s = op.s;
    if ('n' in op) cur.n = op.n;
    cur.t = op.t;
    if (!cur.s && !cur.n) delete st[op.k]; else st[op.k] = cur;
  }
  return st;
}

/* ---------- תקשורת עם השרת ---------- */
async function apiGet(params) {
  const u = scanApi + '?' + new URLSearchParams(Object.assign({}, params, { t: scanToken }));
  const r = await fetch(u, { cache: 'no-store' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.err || 'error');
  return j;
}
async function apiPost(body) {
  const r = await fetch(scanApi, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({}, body, { t: scanToken })),
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.err || 'error');
  return j;
}

function setSync(kind, extra) {
  const msgs = {
    ok: '✓ מסונכרן עם כל הצוות' + (lastSync ? ' · ' + new Date(lastSync).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : ''),
    saving: 'שומר…',
    loading: 'טוען סימונים…',
    offline: 'אין חיבור – השינויים יישמרו כשהחיבור יחזור',
    error: 'שגיאה בשמירה – מנסה שוב…',
    auth: 'השרת לא מזהה את הסיסמה – פנו למנהל האתר',
    local: 'שרת הסריקות עדיין לא מחובר – הסימונים נשמרים רק במכשיר הזה',
  };
  $cvSync.textContent = (msgs[kind] || '') + (extra || '');
  $cvSync.classList.toggle('err', ['offline', 'error', 'auth', 'local'].includes(kind));
}

function saveScan() {
  lsSet(SCAN_STATE_KEY, scanState);
  lsSet(SCAN_QUEUE_KEY, scanQueue);
}

function queueOp(cid, k, patch) {
  let op = scanQueue.find(o => o.c === cid && o.k === k);
  if (!op) { op = { c: cid, k: k }; scanQueue.push(op); }
  Object.assign(op, patch, { t: Date.now() });
  saveScan();
  scheduleFlush(patch.n !== undefined ? 900 : 250);
}

function scheduleFlush(ms) {
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, ms);
}

async function flush() {
  if (flushing || !scanQueue.length) return;
  if (!scanApi) {
    for (const op of scanQueue) {
      const st = scanState[op.c] = scanState[op.c] || {};
      const cur = st[op.k] || {};
      if ('s' in op) cur.s = op.s;
      if ('n' in op) cur.n = op.n;
      cur.t = op.t;
      if (!cur.s && !cur.n) delete st[op.k]; else st[op.k] = cur;
    }
    scanQueue = [];
    saveScan();
    if (curCluster) setSync('local');
    return;
  }
  if (navigator.onLine === false) { if (curCluster) setSync('offline'); return; }
  flushing = true;
  if (curCluster) setSync('saving');
  const sent = scanQueue.map(op => ({ ref: op, t: op.t }));
  const byC = {};
  for (const x of sent) (byC[x.ref.c] = byC[x.ref.c] || []).push(x);
  try {
    for (const c of Object.keys(byC)) {
      const ops = byC[c].map(x => {
        const o = { k: x.ref.k };
        if ('s' in x.ref) o.s = x.ref.s;
        if ('n' in x.ref) o.n = x.ref.n;
        return o;
      });
      const j = await apiPost({ a: 'set', cl: c, ops: ops });
      scanState[c] = j.st || {};
      // מוחקים מהתור רק שינויים שלא נערכו שוב בזמן השליחה
      scanQueue = scanQueue.filter(op => !byC[c].some(x => x.ref === op && x.t === op.t));
    }
    lastSync = Date.now();
    saveScan();
    if (curCluster) { setSync('ok'); refreshRows(); }
  } catch (err) {
    saveScan();
    if (curCluster) setSync(err.message === 'auth' ? 'auth' : (navigator.onLine === false ? 'offline' : 'error'));
    if (err.message !== 'auth') scheduleFlush(10000);
  } finally {
    flushing = false;
    if (scanQueue.some(op => !sent.some(x => x.ref === op && x.t === op.t))) scheduleFlush(300);
  }
}

async function pullCluster(cid) {
  if (!scanApi || flushing) return;
  try {
    const j = await apiGet({ a: 'get', cl: cid });
    scanState[cid] = j.st || {};
    lastSync = Date.now();
    saveScan();
    if (curCluster === cid) {
      setSync(scanQueue.length ? 'saving' : 'ok');
      refreshRows();
    }
  } catch (err) {
    if (curCluster === cid) setSync(err.message === 'auth' ? 'auth' : (navigator.onLine === false ? 'offline' : 'error'));
  }
}

async function refreshSummary() {
  if (scanApi) {
    try {
      const j = await apiGet({ a: 'summary' });
      scanSummary = j.summary || {};
    } catch (_) { return; }
  } else {
    scanSummary = {};
    for (const c of Object.keys(scanState)) {
      const n = Object.values(scanState[c]).filter(v => v.s).length;
      if (n) scanSummary[c] = n;
    }
  }
  if (!curCluster && !norm($q.value)) updateMapCounts();
}

window.addEventListener('online', () => scheduleFlush(200));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (curCluster) { scheduleFlush(100); pullCluster(curCluster); }
  else refreshSummary();
});

/* ---------- מסך הבית: בחירת אשכול ומפה ---------- */
function polyCentroid(pts) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
    const f = x1 * y2 - x2 * y1;
    a += f; cx += (x1 + x2) * f; cy += (y1 + y2) * f;
  }
  if (Math.abs(a) < 1e-9) {
    return [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
  }
  return [cx / (3 * a), cy / (3 * a)];
}

function clusterTotal(cid) { return places.filter(p => p.cluster === cid).length; }

function mapSvg() {
  if (!clusters.length) return '';
  const all = clusters.flatMap(c => c.poly);
  const lat0 = Math.min(...all.map(p => p[0])), lat1 = Math.max(...all.map(p => p[0]));
  const lon0 = Math.min(...all.map(p => p[1])), lon1 = Math.max(...all.map(p => p[1]));
  const k = Math.cos((lat0 + lat1) / 2 * Math.PI / 180);
  const W = 340, pad = 14;
  const sc = (W - 2 * pad) / ((lon1 - lon0) * k || 1);
  const H = Math.round((lat1 - lat0) * sc + 2 * pad);
  const xy = (lat, lon) => [(lon - lon0) * k * sc + pad, (lat1 - lat) * sc + pad];
  const dots = places
    .filter(p => p.point && p.point.lat >= lat0 - .0003 && p.point.lat <= lat1 + .0003
      && p.point.lon >= lon0 - .0003 && p.point.lon <= lon1 + .0003)
    .map(p => { const [x, y] = xy(p.point.lat, p.point.lon); return `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2"/>`; })
    .join('');
  const shapes = clusters.map(c => {
    const pts = c.poly.map(p => xy(p[0], p[1]));
    const [cx, cy] = polyCentroid(pts);
    const color = /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#607d8b';
    const label = 'אשכול ' + c.id + (c.label ? ' ' + c.label : '');
    return `<g class="cl" data-c="${esc(c.id)}" tabindex="0" role="button" aria-label="${esc(label)}">
      <title>${esc(label)}</title>
      <polygon points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="${color}" fill-opacity=".35" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
      <text class="num" x="${cx.toFixed(1)}" y="${(cy + 4).toFixed(1)}">${esc(c.id)}</text>
      <text class="cnt" data-cnt="${esc(c.id)}" x="${cx.toFixed(1)}" y="${(cy + 16).toFixed(1)}"></text>
    </g>`;
  }).join('');
  return `<svg class="cmap" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="group" aria-label="מפת אשכולות">${dots}${shapes}</svg>`;
}

function updateMapCounts() {
  document.querySelectorAll('.cmap [data-cnt]').forEach(t => {
    const cid = t.getAttribute('data-cnt');
    const n = scanSummary[cid] || 0;
    const tot = clusterTotal(cid);
    t.textContent = n ? (n >= tot ? '✓ הושלם' : n + '/' + tot) : '';
    t.classList.toggle('full', n > 0 && n >= tot);
  });
}

function renderHome() {
  if (!clusters.length) { $results.innerHTML = ''; return; }
  $results.innerHTML = `
    <div class="scan">
      <label for="cnum">אשכול צח"י</label>
      <input id="cnum" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="מספר" autocomplete="off" enterkeyhint="go">
      <button id="cgo" type="button">פתיחה</button>
    </div>
    <div id="cmsg" role="alert"></div>
    <div class="cmap-wrap"><span class="cmap-cap">לחצו על אשכול</span>${mapSvg()}</div>`;
  updateMapCounts();
}

function tryOpenFromInput() {
  const inp = document.getElementById('cnum');
  const v = (inp.value || '').replace(/\D/g, '');
  const msg = document.getElementById('cmsg');
  if (!v) { msg.textContent = 'הקלידו מספר אשכול'; inp.focus(); return; }
  if (!clusters.some(c => c.id === v)) {
    msg.textContent = `אין אשכול ${v}. האשכולות: ${clusters.map(c => c.id).join(', ')}`;
    inp.select();
    return;
  }
  inp.blur();
  openCluster(v);
}

$results.addEventListener('click', e => {
  if (e.target.closest('#cgo')) { tryOpenFromInput(); return; }
  const g = e.target.closest('.cmap .cl');
  if (g) openCluster(g.getAttribute('data-c'));
});
$results.addEventListener('keydown', e => {
  if (e.target.id === 'cnum' && e.key === 'Enter') { e.preventDefault(); tryOpenFromInput(); }
  const g = e.target.closest && e.target.closest('.cmap .cl');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openCluster(g.getAttribute('data-c')); }
});

/* ---------- מסך אשכול ---------- */
function openCluster(cid) {
  openedByPush = true;
  if (location.hash === '#c' + cid) routeFromHash();
  else location.hash = 'c' + cid;
}
function closeCluster() {
  if (openedByPush && history.length > 1) history.back();
  else { history.replaceState(null, '', location.pathname + location.search); routeFromHash(); }
}
function routeFromHash() {
  const m = location.hash.match(/^#c(\d{1,3})$/);
  if (m && places.length && clusters.some(c => c.id === m[1])) { showCluster(m[1]); return true; }
  if (curCluster) hideCluster();
  return false;
}
window.addEventListener('hashchange', routeFromHash);
document.getElementById('cvBack').addEventListener('click', closeCluster);

function showCluster(cid) {
  const c = clusters.find(x => x.id === cid);
  curCluster = cid;
  $cvTitle.textContent = 'אשכול ' + cid + (c.label ? ' – ' + c.label : '');
  const col = /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#607d8b';
  $cvHead.style.background = col;
  $cvHead.classList.toggle('light', isLight(col));
  $cv.hidden = false;
  document.body.classList.add('cv-open');
  $cv.scrollTop = 0;
  disarmClear();
  renderCluster();
  setSync(scanApi ? (lastSync ? 'ok' : 'loading') : 'local');
  scheduleFlush(50);
  pullCluster(cid);
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') { if (scanQueue.length) scheduleFlush(50); pullCluster(cid); }
  }, POLL_MS);
}

function isLight(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lin = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  const L = .2126 * lin(n >> 16 & 255) + .7152 * lin(n >> 8 & 255) + .0722 * lin(n & 255);
  return L > .3;   // צבע בהיר → טקסט כהה
}

function hideCluster() {
  curCluster = null;
  clearInterval(pollTimer);
  $cv.hidden = true;
  document.body.classList.remove('cv-open');
  scheduleFlush(50);
  if (!norm($q.value)) { renderHome(); refreshSummary(); }
}

function miniTel(num, label) {
  return `<a class="mtel" href="tel:+972${num.replace(/^0/, '')}" aria-label="התקשרות ל${esc(label)}">${ICON_PHONE}<span>${esc(label)}</span></a>`;
}
function fitNote(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 160) + 'px'; }

function renderCluster() {
  const items = clusterItems(curCluster);
  if (!items.length) {
    $cvList.innerHTML = '<p class="hint">אין רשומות באשכול הזה</p>';
    updateProgress();
    return;
  }
  let html = '', sepDone = false;
  for (const p of items) {
    if (!p.loc && !sepDone) {
      html += '<div class="cv-sep">ללא מספר איתור (מבני ציבור ועוד)</div>';
      sepDone = true;
    }
    const t1 = p.pm ? miniTel(p.pm, p.nm || 'בעל') : (p.pw ? miniTel(p.pw, p.nw || 'אישה') : '');
    const t2 = p.pm && p.pw ? miniTel(p.pw, p.nw || 'אישה') : '';
    html += `<div class="srow" data-k="${esc(recKey(p))}">
      <label class="chk"><input type="checkbox" aria-label="נסרק – ${esc(p.name)}"><span></span></label>
      <div class="who-top"><b>${esc(p.name)}</b>${p.loc ? `<small>${esc(p.loc)}</small>` : ''}<em class="when"></em></div>
      <textarea class="note" rows="1" maxlength="500" placeholder="פירוט מצב…" aria-label="הערה – ${esc(p.name)}"></textarea>
      ${t1 ? t1.replace('class="mtel"', 'class="mtel t1"') : ''}
      ${t2 ? t2.replace('class="mtel"', 'class="mtel t2"') : ''}
    </div>`;
  }
  $cvList.innerHTML = html;
  refreshRows();
}

function refreshRows() {
  if (!curCluster) return;
  const st = stateFor(curCluster);
  $cvList.querySelectorAll('.srow').forEach(row => {
    const v = st[row.dataset.k] || {};
    const cb = row.querySelector('input[type=checkbox]');
    cb.checked = !!v.s;
    row.classList.toggle('done', !!v.s);
    row.querySelector('.when').textContent = v.s && v.t
      ? '✓ ' + new Date(v.t).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '';
    const ta = row.querySelector('.note');
    if (document.activeElement !== ta && ta.value !== (v.n || '')) { ta.value = v.n || ''; fitNote(ta); }
  });
  updateProgress();
}

function updateProgress() {
  const rows = $cvList.querySelectorAll('.srow');
  const done = $cvList.querySelectorAll('.srow.done').length;
  $cvProg.textContent = rows.length ? `${done} / ${rows.length} נסרקו` : '';
  $cvBar.style.width = rows.length ? (100 * done / rows.length) + '%' : '0';
}

$cvList.addEventListener('change', e => {
  if (e.target.type !== 'checkbox' || !curCluster) return;
  const row = e.target.closest('.srow');
  queueOp(curCluster, row.dataset.k, { s: e.target.checked });
  refreshRows();
});
const noteTimers = {};
$cvList.addEventListener('input', e => {
  if (!e.target.classList.contains('note') || !curCluster) return;
  const k = e.target.closest('.srow').dataset.k, cid = curCluster, ta = e.target;
  fitNote(ta);
  clearTimeout(noteTimers[k]);
  noteTimers[k] = setTimeout(() => queueOp(cid, k, { n: ta.value }), 700);
});
$cvList.addEventListener('focusout', e => {
  if (!e.target.classList.contains('note') || !curCluster) return;
  const k = e.target.closest('.srow').dataset.k;
  clearTimeout(noteTimers[k]);
  const cur = (stateFor(curCluster)[k] || {}).n || '';
  if (e.target.value !== cur) queueOp(curCluster, k, { n: e.target.value });
});

/* סיכום לוואטסאפ */
document.getElementById('cvWa').addEventListener('click', () => {
  if (!curCluster) return;
  const st = stateFor(curCluster);
  const items = clusterItems(curCluster);
  const done = items.filter(p => (st[recKey(p)] || {}).s).length;
  const c = clusters.find(x => x.id === curCluster);
  const lines = [`סריקת אשכול ${curCluster}${c && c.label ? ' (' + c.label + ')' : ''} – ${done}/${items.length} נסרקו`, ''];
  for (const p of items) {
    const v = st[recKey(p)] || {};
    lines.push(`${v.s ? '✅' : '⬜'} ${p.name}${p.loc ? ' (' + p.loc + ')' : ''}${v.n ? ' – ' + v.n.replace(/\s+/g, ' ') : ''}`);
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(lines.join('\n')), '_blank', 'noopener');
});

/* ניקוי אשכול – לחיצה כפולה לאישור */
let clearArmT = null;
function disarmClear() {
  clearTimeout(clearArmT);
  $cvClear.classList.remove('armed');
  $cvClear.textContent = 'ניקוי האשכול';
}
$cvClear.addEventListener('click', async () => {
  if (!curCluster) return;
  if (!$cvClear.classList.contains('armed')) {
    $cvClear.classList.add('armed');
    $cvClear.textContent = 'לחצו שוב – ימחק לכולם';
    clearArmT = setTimeout(disarmClear, 4000);
    return;
  }
  disarmClear();
  const cid = curCluster;
  scanQueue = scanQueue.filter(op => op.c !== cid);
  if (scanApi) {
    setSync('saving');
    try {
      const j = await apiPost({ a: 'clear', cl: cid });
      scanState[cid] = j.st || {};
      lastSync = Date.now();
      setSync('ok');
    } catch (err) {
      setSync(err.message === 'auth' ? 'auth' : 'error', ' (הניקוי לא בוצע)');
    }
  } else {
    scanState[cid] = {};
  }
  saveScan();
  refreshRows();
});

/* ---------- טעינה, סיסמה ופענוח ---------- */
const $gate = document.getElementById('gate');
const $gateForm = document.getElementById('gateForm');
const $pw = document.getElementById('pw');
const $pwGo = document.getElementById('pwGo');
const $pwMsg = document.getElementById('pwMsg');
let enc = null;

function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (_) { return null; }
}
function saveCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
}
// סיסמה סלחנית: בלי רווחים, ואותיות סופיות כרגילות ("שלום עולם" = "שלומעולמ")
function normPass(s) {
  return String(s || '').replace(/\s+/g, '').replace(/[ךםןףץ]/g, c => FINALS[c]);
}
function getSavedPass() {
  try {
    const o = JSON.parse(localStorage.getItem(PASS_KEY) || 'null');
    if (o && o.p && Date.now() - o.t < PASS_TTL) return o.p;
  } catch (_) {}
  return null;
}
function savePass(p) {
  try { localStorage.setItem(PASS_KEY, JSON.stringify({ p, t: Date.now() })); } catch (_) {}
}
function clearPass() {
  try { localStorage.removeItem(PASS_KEY); } catch (_) {}
}
function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function decrypt(e, pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(e.salt), iterations: e.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, key, b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function askPassword(msg) {
  return new Promise(resolve => {
    $gate.hidden = false;
    $pwMsg.textContent = msg || '';
    setTimeout(() => $pw.focus(), 50);
    $gateForm.onsubmit = async ev => {
      ev.preventDefault();
      const p = normPass($pw.value);
      if (!p) return;
      $pwGo.disabled = true;
      $pwGo.textContent = 'בודק…';
      try {
        const data = await decrypt(enc, p);
        savePass(p);
        $gate.hidden = true;
        $pw.value = '';
        resolve(data);
      } catch (_) {
        $pwMsg.textContent = 'סיסמה שגויה – נסו שוב';
        $pw.select();
      } finally {
        $pwGo.disabled = false;
        $pwGo.textContent = 'כניסה';
      }
    };
  });
}
async function unlock() {
  const saved = getSavedPass();
  if (saved) {
    try { return await decrypt(enc, saved); }
    catch (_) { clearPass(); return askPassword('הסיסמה הוחלפה – הזינו את הסיסמה החדשה'); }
  }
  return askPassword();
}

async function init() {
  // כל כניסה מתחילה בחיפוש ריק: מנקים שאריות ?q= מגרסה קודמת, וגם ערך שהדפדפן שחזר
  try {
    const u = new URL(location.href);
    if (u.searchParams.has('q')) { u.searchParams.delete('q'); history.replaceState(null, '', u); }
  } catch (_) {}
  $q.value = '';

  if (!window.crypto || !crypto.subtle) {
    setStatus('הדפדפן לא תומך', true);
    $results.innerHTML = '<p class="hint">הדפדפן הזה ישן מדי. פתחו את הקישור בכרום או בספארי מעודכנים.</p>';
    return;
  }

  const cached = loadCache();
  let fresh = null, netErr = null;
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('שגיאת רשת ' + r.status);
    fresh = await r.json();
    saveCache(fresh);
  } catch (err) { netErr = err; }

  enc = fresh || cached;
  if (!enc || !enc.ct) {
    setStatus('שגיאה', true);
    $results.innerHTML = `<p class="hint">לא ניתן לטעון את הנתונים<br>${esc(netErr ? netErr.message : '')}</p>`;
    return;
  }

  const data = await unlock();
  places = prepare(data);
  await setupScan(data);
  lastUpdated = enc.updated;
  if (fresh) defaultStatus();
  else setStatus(`אין חיבור – נתונים שמורים מ-${fmtTime(enc.updated)}`, true);
  render();
  if (!routeFromHash()) focusSearch();
}
init();
</script>
