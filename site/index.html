<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f5f4a">
<title>איתור – בית יתיר</title>
<style>
  :root {
    --bg: #f4f6f4;
    --surface: #ffffff;
    --text: #1b2420;
    --muted: #5f6b66;
    --border: #dde3df;
    --accent: #1f5f4a;
    --accent-soft: #e3efe9;
    --waze: #33ccff;
    --waze-text: #06202b;
    --gmaps: #1a73e8;
    --danger: #b3261e;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111614;
      --surface: #1a211e;
      --text: #e7ece9;
      --muted: #9aa7a1;
      --border: #2b3531;
      --accent: #6cc2a0;
      --accent-soft: #1f2e28;
      --gmaps: #5b9cf5;
      --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  #status { font-size: .8rem; color: var(--muted); }
  #status.err { color: var(--danger); }
  .search { position: relative; }
  #q {
    width: 100%;
    font: inherit;
    font-size: 1.1rem;
    padding: 12px 14px 12px 44px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #q::-webkit-search-cancel-button { display: none; }
  #clear {
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    display: none;
  }
  #clear.show { display: block; }
  main { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }
  .hint { color: var(--muted); text-align: center; padding: 32px 8px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-head { display: flex; align-items: flex-start; gap: 12px; }
  .loc {
    flex: none;
    min-width: 64px;
    padding: 6px 8px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    text-align: center;
    line-height: 1.2;
  }
  .loc small { display: block; font-size: .7rem; opacity: .8; }
  .loc b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .name { font-size: 1.1rem; font-weight: 600; margin: 0; word-break: break-word; }
  .meta { font-size: .85rem; color: var(--muted); margin-top: 2px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    flex: 1 1 0;
    min-width: 110px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 11px 10px;
    border-radius: 12px;
    border: 0;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-waze { background: var(--waze); color: var(--waze-text); }
  .btn-gmaps { background: var(--gmaps); color: #fff; }
  .btn-share { flex: 0 0 auto; min-width: 0; background: var(--accent-soft); color: var(--accent); }
  .nocoords { margin-top: 10px; font-size: .85rem; color: var(--muted); }
  .more { text-align: center; color: var(--muted); font-size: .85rem; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>איתור בבית יתיר</h1>
      <span id="status">טוען…</span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="מספר איתור או שם משפחה" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="חיפוש">
      <button id="clear" type="button" aria-label="ניקוי">×</button>
    </div>
  </div>
</header>
<main class="wrap" id="results"><p class="hint">טוען נתונים…</p></main>

<script>
const DATA_URL = 'data/residents.json';
const MAX_RESULTS = 30;
const CACHE_KEY = 'yatir-residents-v1';

let places = [];
const $q = document.getElementById('q');
const $results = document.getElementById('results');
const $status = document.getElementById('status');
const $clear = document.getElementById('clear');

const FINALS = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
function norm(s) {
  return String(s || '')
    .replace(/[֑-ׇ‎‏]/g, '')
    .replace(/[ךםןףץ]/g, c => FINALS[c])
    .replace(/["'`״׳\-–_.,/\\()+]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtTime(t) {
  return new Date(t).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function setStatus(msg, isErr) {
  $status.textContent = msg;
  $status.classList.toggle('err', !!isErr);
}

function prepare(data) {
  return (data.items || []).map((it, i) => ({
    id: i,
    name: it.n || '(ללא שם)',
    loc: it.l || '',
    cluster: it.c || '',
    point: (typeof it.lat === 'number' && typeof it.lon === 'number') ? { lat: it.lat, lon: it.lon } : null,
    nName: norm(it.n),
    hay: norm([it.n, it.l, it.c ? 'אשכול ' + it.c : ''].join(' ')),
  }));
}

function search(q) {
  const nq = norm(q);
  if (!nq) return [];
  const tokens = nq.split(' ');
  const isNum = /^\d+$/.test(nq);
  const out = [];
  for (const p of places) {
    let score = 0;
    if (isNum) {
      if (p.loc === nq) score = 100;
      else if (p.loc.startsWith(nq)) score = 70;
      else if (p.cluster === nq) score = 30;
    } else if (tokens.every(t => p.hay.includes(t))) {
      score = 40;
      if (p.nName.startsWith(nq)) score = 80;
      else if (new RegExp('(^| )' + nq.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(p.nName)) score = 65;
    }
    if (score) out.push({ p, score });
  }
  out.sort((a, b) => b.score - a.score
    || (parseInt(a.p.loc) || 1e9) - (parseInt(b.p.loc) || 1e9)
    || a.p.name.localeCompare(b.p.name, 'he', { numeric: true }));
  return out.map(o => o.p);
}

function highlight(text, q) {
  let out = esc(text);
  const tokens = norm(q).split(' ').filter(t => t.length > 1 || /\d/.test(t));
  for (const t of tokens) {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    out = out.replace(re, '<mark>$1</mark>');
  }
  return out;
}

function card(p, q) {
  let actions = '<p class="nocoords">אין מיקום למקום זה</p>';
  if (p.point) {
    const ll = p.point.lat + ',' + p.point.lon;
    actions = `<div class="actions">
      <a class="btn btn-waze" href="https://waze.com/ul?ll=${ll}&navigate=yes" target="_blank" rel="noopener">ניווט ב-Waze</a>
      <a class="btn btn-gmaps" href="https://www.google.com/maps/dir/?api=1&destination=${ll}" target="_blank" rel="noopener">Google Maps</a>
      <button class="btn btn-share" type="button" data-share="${p.id}" aria-label="שיתוף מיקום">שיתוף</button>
    </div>`;
  }
  return `<article class="card">
    <div class="card-head">
      ${p.loc ? `<div class="loc"><small>איתור</small><b>${highlight(p.loc, q)}</b></div>` : ''}
      <div>
        <h2 class="name">${highlight(p.name, q)}</h2>
        ${p.cluster ? `<div class="meta">אשכול ${esc(p.cluster)}</div>` : ''}
      </div>
    </div>
    ${actions}
  </article>`;
}

function render() {
  const q = $q.value;
  $clear.classList.toggle('show', !!q);
  if (!places.length) return;
  if (!norm(q)) {
    $results.innerHTML = '<p class="hint">הקלידו מספר איתור או שם משפחה</p>';
    return;
  }
  const res = search(q);
  if (!res.length) {
    $results.innerHTML = `<p class="hint">לא נמצאו תוצאות ל"${esc(q)}"</p>`;
    return;
  }
  const shown = res.slice(0, MAX_RESULTS);
  $results.innerHTML = shown.map(p => card(p, q)).join('')
    + (res.length > shown.length ? `<p class="more">מוצגות ${shown.length} מתוך ${res.length} – צמצמו את החיפוש</p>` : '');
}

$results.addEventListener('click', async e => {
  const b = e.target.closest('[data-share]');
  if (!b) return;
  const p = places[+b.dataset.share];
  if (!p || !p.point) return;
  const url = `https://www.google.com/maps/search/?api=1&query=${p.point.lat},${p.point.lon}`;
  const title = (p.loc ? 'איתור ' + p.loc + ' – ' : '') + p.name;
  try {
    if (navigator.share) await navigator.share({ title, text: title + ', בית יתיר', url });
    else {
      await navigator.clipboard.writeText(title + '\n' + url);
      b.textContent = 'הועתק';
      setTimeout(() => { b.textContent = 'שיתוף'; }, 1500);
    }
  } catch (_) { /* בוטל */ }
});

let tId;
$q.addEventListener('input', () => {
  clearTimeout(tId);
  tId = setTimeout(() => {
    render();
    try {
      const u = new URL(location.href);
      $q.value ? u.searchParams.set('q', $q.value) : u.searchParams.delete('q');
      history.replaceState(null, '', u);
    } catch (_) {}
  }, 120);
});
$clear.addEventListener('click', () => { $q.value = ''; $q.dispatchEvent(new Event('input')); $q.focus(); });
$q.addEventListener('keydown', e => { if (e.key === 'Enter') $q.blur(); });

function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (_) { return null; }
}
function saveCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
}

async function init() {
  try {
    const q0 = new URL(location.href).searchParams.get('q');
    if (q0) $q.value = q0;
  } catch (_) {}

  const cached = loadCache();
  if (cached && cached.items) {
    places = prepare(cached);
    setStatus('מתעדכן…');
    render();
  }
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('שגיאת רשת ' + r.status);
    const data = await r.json();
    places = prepare(data);
    saveCache(data);
    setStatus(`${places.length} רשומות · עודכן ${fmtTime(data.updated)}`);
    render();
  } catch (err) {
    if (places.length) {
      setStatus(`אין חיבור – נתונים שמורים מ-${fmtTime(cached.updated)}`, true);
    } else {
      setStatus('שגיאה', true);
      $results.innerHTML = `<p class="hint">לא ניתן לטעון את הנתונים<br>${esc(err.message)}</p>`;
    }
  }
}
init();
</script>
</body>
</html>
